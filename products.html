<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Shop | Mayuri Handcrafted Jewellery</title><link rel="stylesheet" href="../css/style.css"><style>
.shop-page{background:#fffaf7}.shop-header{text-align:center;padding:55px 20px 25px}.shop-header p{color:#b8860b;letter-spacing:2px;font-size:13px}.shop-header h1{font:40px Georgia,serif;color:#4b2c20;margin:12px}.shop-header span{color:#777}.filters{text-align:center;margin:10px auto 40px}.filter-btn{border:1px solid #c9a227;background:#fff;color:#4b2c20;padding:10px 20px;margin:5px;border-radius:25px;cursor:pointer}.filter-btn.active,.filter-btn:hover{background:#c9a227;color:#fff}.products{width:86%;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:25px;padding-bottom:70px}.products .product-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.08);transition:.3s}.products .product-card:hover{transform:translateY(-5px)}.products .product-card img{width:100%;height:280px;object-fit:cover;display:block}.products .product-info{padding:20px;text-align:center}.products .product-info h3{color:#4b2c20;margin-bottom:8px}.category{color:#999;font-size:14px;margin-bottom:8px}.price{color:#b8860b;font-weight:bold;font-size:18px;margin-bottom:15px}.view-btn,.cart-btn{border:none;padding:10px 15px;border-radius:5px;cursor:pointer;margin:3px;font-size:14px}.view-btn{background:#4b2c20;color:#fff}.cart-btn{background:#c9a227;color:#fff}.no-products{text-align:center;grid-column:1/-1;padding:50px}.shop-nav{height:75px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 7%;box-shadow:0 2px 10px rgba(0,0,0,.08);position:sticky;top:0;z-index:5}.shop-nav .logo img{width:65px;height:65px;object-fit:contain}.shop-nav ul{list-style:none;display:flex;gap:28px;align-items:center}.shop-nav a{text-decoration:none;color:#4b2c20}.cart-link{font-size:20px}@media(max-width:900px){.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.shop-nav{padding:0 4%}.shop-nav ul{gap:10px}.shop-nav ul li:nth-child(3),.shop-nav ul li:nth-child(4),.shop-nav ul li:nth-child(5){display:none}.products{grid-template-columns:1fr;width:90%}.shop-header h1{font-size:30px}}
</style></head><body class="shop-page">
<header class="shop-nav"><div class="logo"><a href="../index.html"><img src="../images/logo.png" alt="Mayuri Handcrafted Jewellery"></a></div><ul><li><a href="../index.html">Home</a></li><li><a href="products.html">Shop</a></li><li><a href="../index.html#custom-order">Custom Order</a></li><li><a href="../index.html#about">About</a></li><li><a href="../index.html#contact">Contact</a></li><li><a class="cart-link" href="cart.html">🛒 <small data-cart-count>0</small></a></li><li><a href="orders.html">📦</a></li></ul></header>
<section class="shop-header"><p>OUR COLLECTION</p><h1>Shop Jewellery</h1><span>Handcrafted with love for your special moments.</span></section>
<div class="filters"><button class="filter-btn active" data-filter="All">All</button><button class="filter-btn" data-filter="Nath">Nath</button><button class="filter-btn" data-filter="Mangalsutra">Mangalsutra</button><button class="filter-btn" data-filter="Challa">Challa</button><button class="filter-btn" data-filter="Ear Cuffs">Ear Cuffs</button></div>
<section class="products" id="productsGrid"></section>
<footer><div class="footer-logo"><img src="../images/logo.png" alt="Mayuri"></div><p>HANDCRAFTED JEWELLERY</p><div class="footer-categories">Nath • Mangalsutra • Challa • Ear Cuffs</div><div class="footer-line"></div><small>© 2026 Mayuri Handcrafted Jewellery. All Rights Reserved.</small></footer>
<script src="../js/main.js"></script><script>
const grid=document.getElementById('productsGrid'); const params=new URLSearchParams(location.search); let selected=params.get('category')||'All';
function renderProducts(filter='All'){selected=filter;grid.innerHTML='';const list=MAYURI_PRODUCTS.filter(p=>filter==='All'||p.category===filter);if(!list.length){grid.innerHTML='<div class="no-products"><h2>No products found</h2><p>Please choose another category.</p></div>';return;}list.forEach(p=>{const card=document.createElement('div');card.className='product-card';card.innerHTML=`<img src="../images/${p.image}" alt="${p.name}"><div class="product-info"><h3>${p.name}</h3><p class="category">${p.category}</p><p class="price">₹${p.price}</p><a href="products-details.html?id=${p.id}"><button class="view-btn">View Details</button></a><button class="cart-btn" data-add="${p.id}">Add to Cart</button></div>`;grid.appendChild(card);card.querySelector('[data-add]').onclick=()=>addProductToCart(p);});document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));}
document.querySelectorAll('.filter-btn').forEach(b=>b.onclick=()=>{const f=b.dataset.filter;history.replaceState(null,'','products.html'+(f==='All'?'':'?category='+encodeURIComponent(f)));renderProducts(f);});renderProducts(selected);updateCartCount();
</script></body></html>
