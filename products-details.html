<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Product Details | Mayuri</title><link rel="stylesheet" href="../css/style.css"><style>
.details-page{background:#fffaf7}.detail-nav{height:75px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 7%;box-shadow:0 2px 10px rgba(0,0,0,.08);position:sticky;top:0;z-index:5}.detail-nav img{width:65px;height:65px;object-fit:contain}.detail-nav ul{display:flex;gap:25px;list-style:none;align-items:center}.detail-nav a{text-decoration:none;color:#4b2c20}.details-container{width:86%;margin:60px auto;display:grid;grid-template-columns:1fr 1fr;gap:60px;background:#fff;padding:40px;border-radius:16px;box-shadow:0 5px 25px rgba(0,0,0,.07)}.details-image img{width:100%;height:520px;object-fit:cover;border-radius:15px}.details-info .tag{color:#b8860b;letter-spacing:2px;font-size:13px}.details-info h1{font:42px Georgia,serif;color:#4b2c20;margin:12px 0}.details-price{font-size:28px;color:#b8860b;font-weight:bold}.description{color:#666;line-height:1.8;margin:20px 0}.quantity{display:flex;align-items:center;gap:15px;margin:25px 0}.quantity button{width:42px;height:42px;padding:0;border:1px solid #c9a227;background:#fff;color:#4b2c20}.quantity input{width:55px;text-align:center;padding:10px;border:1px solid #ddd}.detail-buttons{display:flex;gap:10px;flex-wrap:wrap}.detail-buttons button{padding:14px 22px;border:0;border-radius:5px}.add-btn{background:#4b2c20;color:#fff}.buy-btn{background:#c9a227;color:#fff}.wish-btn{background:#eee;color:#4b2c20}.back{display:inline-block;margin-top:25px;color:#4b2c20}.related{width:86%;margin:0 auto 70px}.related h2{text-align:center;font:32px Georgia,serif}.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;margin-top:25px}.related-grid img{width:100%;height:230px;object-fit:cover;border-radius:12px}@media(max-width:800px){.details-container{grid-template-columns:1fr}.details-image img{height:400px}.related-grid{grid-template-columns:1fr}.detail-nav ul li:nth-child(n+3){display:none}}
</style></head><body class="details-page">
<header class="detail-nav"><a href="../index.html"><img src="../images/logo.png" alt="Mayuri"></a><ul><li><a href="../index.html">Home</a></li><li><a href="products.html">Shop</a></li><li><a href="orders.html">📦 Orders</a></li><li><a href="cart.html">🛒 <small data-cart-count>0</small></a></li></ul></header>
<main><div class="details-container"><div class="details-image"><img id="productImage" src="../images/nath.jpeg" alt="Jewellery"></div><div class="details-info"><p class="tag" id="productCategory"></p><h1 id="productName"></h1><div class="details-price" id="productPrice"></div><p class="description" id="productDescription"></p><div class="quantity"><button onclick="changeQty(-1)">−</button><input id="quantity" type="number" min="1" value="1"><button onclick="changeQty(1)">+</button></div><div class="detail-buttons"><button class="add-btn" onclick="addCurrentToCart()">ADD TO CART</button><button class="buy-btn" onclick="buyCurrent()">BUY NOW</button><button class="wish-btn" onclick="wishlist()">♡ WISHLIST</button></div><a class="back" href="products.html">← Back to Shop</a></div></div><section class="related"><h2>More Jewellery</h2><div class="related-grid" id="relatedGrid"></div></section></main>
<script src="../js/main.js"></script><script>
const id=new URLSearchParams(location.search).get('id')||'1';const product=productById(id)||MAYURI_PRODUCTS[0];document.title=product.name+' | Mayuri Handcrafted Jewellery';document.getElementById('productImage').src='../images/'+product.image;document.getElementById('productImage').alt=product.name;document.getElementById('productCategory').textContent=product.category;document.getElementById('productName').textContent=product.name;document.getElementById('productPrice').textContent='₹'+product.price;document.getElementById('productDescription').textContent=product.description;
function changeQty(d){const i=document.getElementById('quantity');i.value=Math.max(1,Number(i.value||1)+d)}function qty(){return Math.max(1,Number(document.getElementById('quantity').value||1))}function addCurrentToCart(){addProductToCart(product,qty())}function buyCurrent(){buyProduct(product,qty())}function wishlist(){const w=readStorage(WISHLIST_KEY,[]);if(!w.some(x=>x.id===product.id)){w.push({...product});writeStorage(WISHLIST_KEY,w);alert('Product added to wishlist!')}else alert('Product is already in wishlist!')}
const rg=document.getElementById('relatedGrid');MAYURI_PRODUCTS.filter(p=>p.id!==product.id).slice(0,3).forEach(p=>{const a=document.createElement('a');a.href='products-details.html?id='+p.id;a.innerHTML=`<img src="../images/${p.image}" alt="${p.name}"><h3>${p.name}</h3>`;rg.appendChild(a)});updateCartCount();
</script></body></html>
