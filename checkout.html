<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout | Mayuri</title><link rel="stylesheet" href="../css/style.css"><style>.checkout-head{text-align:center;padding:45px 20px}.checkout-container{width:86%;margin:auto;display:grid;grid-template-columns:1.4fr 1fr;gap:30px;padding-bottom:70px}.checkout-box,.order-summary{background:#fff;border-radius:14px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,.07)}.form-group{margin-bottom:16px}.form-group label{display:block;margin-bottom:7px;font-weight:bold;color:#4b2c20}.form-group input,.form-group textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:5px;font:inherit}.form-group textarea{min-height:100px;resize:vertical}.payment-options{margin:20px 0}.payment-option{display:block;padding:12px;background:#fffaf7;margin:8px 0;border-radius:6px}.place-order-btn{width:100%;margin-top:10px}.summary-item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.summary-row,.summary-total{display:flex;justify-content:space-between;padding:14px 0}.summary-total{border-top:1px solid #ccc;font-size:20px;font-weight:bold}.back-cart{display:block;margin-top:20px;color:#4b2c20}.topnav{height:75px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 7%;box-shadow:0 2px 10px rgba(0,0,0,.08)}.topnav img{width:65px}.topnav nav{display:flex;gap:25px}.topnav a{text-decoration:none;color:#4b2c20}@media(max-width:800px){.checkout-container{grid-template-columns:1fr;width:92%}}
</style></head><body><header class="topnav"><a href="../index.html"><img src="../images/logo.png" alt="Mayuri"></a><nav><a href="../index.html">Home</a><a href="products.html">Shop</a><a href="cart.html">Cart</a><a href="orders.html">My Orders</a></nav></header><section class="checkout-head"><p class="section-small">SECURE CHECKOUT</p><h1>Complete Your Order</h1></section><main class="checkout-container"><div class="checkout-box"><h2>Customer Details</h2><form id="checkoutForm"><div class="form-group"><label>Full Name *</label><input id="name" required></div><div class="form-group"><label>Mobile Number *</label><input id="mobile" inputmode="numeric" maxlength="10" required></div><div class="form-group"><label>Email Address</label><input id="email" type="email"></div><div class="form-group"><label>Full Address *</label><textarea id="address" required></textarea></div><div class="form-group"><label>City *</label><input id="city" required></div><div class="form-group"><label>Pincode *</label><input id="pincode" inputmode="numeric" maxlength="6" required></div><div class="payment-options"><h3>Payment Method</h3><label class="payment-option"><input type="radio" name="payment" value="Cash on Delivery" checked> Cash on Delivery</label><label class="payment-option"><input type="radio" name="payment" value="UPI"> UPI Payment</label><label class="payment-option"><input type="radio" name="payment" value="Card"> Card Payment</label></div><button type="submit" class="place-order-btn">PLACE ORDER</button></form><a href="cart.html" class="back-cart">← Back to Cart</a></div><aside class="order-summary"><h2>Your Order</h2><div id="orderItems"></div><div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div><div class="summary-row"><span>Delivery</span><span>FREE</span></div><div class="summary-total"><span>Total</span><span id="total">₹0</span></div></aside></main><footer><small>© 2026 Mayuri Handcrafted Jewellery. All Rights Reserved.</small></footer>
<script>
const CART_KEY='mayuriCart', ORDERS_KEY='mayuriOrders';const cart=(()=>{try{return JSON.parse(localStorage.getItem(CART_KEY))||[]}catch{return[]}})();
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function render(){const box=document.getElementById('orderItems');let total=0;if(!cart.length){box.innerHTML='<p>Your cart is empty. <a href="products.html">Shop now</a></p>';return;}box.innerHTML=cart.map(i=>{const q=Number(i.quantity||1),t=Number(i.price)*q;total+=t;return `<div class="summary-item"><span>${i.name} × ${q}</span><span>${money(t)}</span></div>`}).join('');document.getElementById('subtotal').textContent=money(total);document.getElementById('total').textContent=money(total)}
render();document.getElementById('checkoutForm').addEventListener('submit',async e=>{e.preventDefault();if(!cart.length){alert('Your cart is empty!');return;}const name=document.getElementById('name').value.trim(),mobile=document.getElementById('mobile').value.trim(),email=document.getElementById('email').value.trim(),address=document.getElementById('address').value.trim(),city=document.getElementById('city').value.trim(),pincode=document.getElementById('pincode').value.trim(),payment=document.querySelector('input[name="payment"]:checked').value;if(!/^\d{10}$/.test(mobile)){alert('Please enter a valid 10 digit mobile number.');return}if(!/^\d{6}$/.test(pincode)){alert('Please enter a valid 6 digit pincode.');return}const total=cart.reduce((s,i)=>s+Number(i.price)*Number(i.quantity||1),0);const order={orderId:'MY'+Date.now().toString().slice(-8),customerName:name,mobile,email,address,city,pincode,paymentMethod:payment,items:cart.map(i=>({...i})),total,status:'Placed',createdAt:new Date().toISOString()};let orders=[];try{orders=JSON.parse(localStorage.getItem(ORDERS_KEY))||[]}catch{}orders.push(order);localStorage.setItem(ORDERS_KEY,JSON.stringify(orders));
try{await fetch('http://localhost:5000/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(order)});}catch(_){/* static mode works without backend */}
localStorage.setItem('mayuriOrder',JSON.stringify(order));localStorage.removeItem(CART_KEY);location.href='order-success.html?orderId='+encodeURIComponent(order.orderId);});
</script></body></html>
