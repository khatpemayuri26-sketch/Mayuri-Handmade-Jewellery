<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Order Placed | Mayuri</title><link rel="stylesheet" href="../css/style.css"><style>.success-wrap{max-width:850px;margin:70px auto;padding:40px 20px;text-align:center}.success-icon{width:80px;height:80px;border-radius:50%;background:#efe2d8;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:42px}.success-wrap h1{font:42px Georgia,serif;color:#4b2c20}.order-details{background:#fff;border:1px solid #e5ddd8;border-radius:14px;margin:30px 0;padding:25px;text-align:left}.order-row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #eee}.order-row:last-child{border:0}.success-buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.success-buttons a{text-decoration:none}.secondary-btn{background:#fff!important;color:#302522!important;border:1px solid #302522!important}.topnav{height:75px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 7%;box-shadow:0 2px 10px rgba(0,0,0,.08)}.topnav img{width:65px}.topnav nav{display:flex;gap:25px}.topnav a{text-decoration:none;color:#4b2c20}</style></head><body><header class="topnav"><a href="../index.html"><img src="../images/logo.png" alt="Mayuri"></a><nav><a href="../index.html">Home</a><a href="products.html">Shop</a><a href="orders.html">My Orders</a><a href="cart.html">🛒</a></nav></header><main class="success-wrap"><div class="success-icon">✓</div><h1>Order Placed Successfully!</h1><p>Thank you for shopping with Mayuri Handcrafted Jewellery.</p><div class="order-details"><div class="order-row"><span>Order ID</span><strong id="orderId">-</strong></div><div class="order-row"><span>Customer</span><strong id="customer">-</strong></div><div class="order-row"><span>Payment</span><strong id="payment">-</strong></div><div class="order-row"><span>Total</span><strong id="total">₹0</strong></div><div class="order-row"><span>Status</span><strong id="status">Placed</strong></div></div><div class="success-buttons"><a href="orders.html"><button>VIEW MY ORDERS</button></a><a href="products.html"><button>CONTINUE SHOPPING</button></a><a href="../index.html"><button class="secondary-btn">GO HOME</button></a></div></main><footer><small>© 2026 Mayuri Handcrafted Jewellery. All Rights Reserved.</small></footer><script>let o=null;try{o=JSON.parse(localStorage.getItem('mayuriOrder'))}catch{}if(!o){const id=new URLSearchParams(location.search).get('orderId');try{o=(JSON.parse(localStorage.getItem('mayuriOrders'))||[]).find(x=>x.orderId===id)}catch{}}if(o){document.getElementById('orderId').textContent=o.orderId||'-';document.getElementById('customer').textContent=o.customerName||'-';document.getElementById('payment').textContent=o.paymentMethod||'-';document.getElementById('total').textContent='₹'+Number(o.total||0).toLocaleString('en-IN');document.getElementById('status').textContent=o.status||'Placed';}</script></body></html>
