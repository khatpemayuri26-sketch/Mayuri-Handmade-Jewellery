<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Orders | Mayuri</title><link rel="stylesheet" href="../css/style.css"><style>.orders-head{text-align:center;padding:50px 20px}.orders-wrap{width:86%;margin:auto;padding-bottom:70px}.order-card{background:#fff;border:1px solid #eadfd8;border-radius:14px;padding:25px;margin-bottom:20px;box-shadow:0 4px 15px rgba(0,0,0,.05)}.order-top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;border-bottom:1px solid #eee;padding-bottom:15px}.order-status{color:#8b6252;font-weight:bold}.order-product{display:flex;align-items:center;gap:15px;padding:15px 0;border-bottom:1px solid #f1ece9}.order-product img{width:70px;height:70px;object-fit:cover;border-radius:8px}.order-total{display:flex;justify-content:space-between;font-weight:bold;font-size:18px;padding-top:15px}.empty{text-align:center;background:#fff;padding:60px;border-radius:14px}.topnav{height:75px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 7%;box-shadow:0 2px 10px rgba(0,0,0,.08)}.topnav img{width:65px}.topnav nav{display:flex;gap:25px}.topnav a{text-decoration:none;color:#4b2c20}@media(max-width:600px){.orders-wrap{width:92%}}
</style></head><body><header class="topnav"><a href="../index.html"><img src="../images/logo.png" alt="Mayuri"></a><nav><a href="../index.html">Home</a><a href="products.html">Shop</a><a href="cart.html">Cart</a></nav></header><section class="orders-head"><p class="section-small">MAYURI JEWELLERY</p><h1>My Orders</h1><p>Your orders placed on this device are saved here.</p></section><main class="orders-wrap" id="ordersList"></main><footer><small>© 2026 Mayuri Handcrafted Jewellery. All Rights Reserved.</small></footer><script>let orders=[];try{orders=JSON.parse(localStorage.getItem('mayuriOrders'))||[]}catch{}const box=document.getElementById('ordersList');function img(x){return x&&x.startsWith('../')?x:'../images/'+(x||'logo.png')}if(!orders.length){box.innerHTML='<div class="empty"><h2>No orders yet</h2><p>Place an order and it will appear here.</p><a href="products.html"><button>SHOP JEWELLERY</button></a></div>'}else{box.innerHTML=orders.slice().reverse().map(o=>`<article class="order-card"><div class="order-top"><div><strong>Order ID: ${o.orderId||o.id||'-'}</strong><br><small>${new Date(o.createdAt||Date.now()).toLocaleString('en-IN')}</small></div><div class="order-status">${o.status||'Placed'}</div></div>${(o.items||[]).map(i=>`<div class="order-product"><img src="${img(i.image)}" alt="${i.name}"><div><strong>${i.name}</strong><br><small>Qty: ${i.quantity||1} × ₹${i.price}</small></div></div>`).join('')}<div class="order-total"><span>Total</span><span>₹${Number(o.total||0).toLocaleString('en-IN')}</span></div></article>`).join('')}</script></body></html>
